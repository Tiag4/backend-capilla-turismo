# Configuración de la aplicación
spring.application.name=BackendForoUPC

# Conexión con PostgreSQL local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portal_turismo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Directiva JPA para actualizar/generar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar sentencias SQL formateadas en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar open-in-view warning
spring.jpa.open-in-view=false

# Desactivar persistencia de sesiones en disco (API REST sin estado)
server.servlet.session.persistent=false

# Configuración de JWT
jwt.secret=9a6747f3b64c61d4a607645061ce7212513a94f55393b2cef440355125a4e921
jwt.expiration=86400000

# Configuración de Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Configuración de Subida de Archivos Multipart (Máximo 5MB por imagen)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de Almacenamiento Agnóstico (local o cloudinary)
storage.provider=${STORAGE_PROVIDER:local}
storage.local.upload-dir=${STORAGE_LOCAL_DIR:uploads}
storage.local.base-url=${STORAGE_LOCAL_BASE_URL:}

# Configuración Cloudinary
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

