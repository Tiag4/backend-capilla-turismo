# Configuración de la aplicación
spring.application.name=BackendForoUPC

# Conexión con MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/portal_turismo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Directiva JPA para actualizar/generar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar sentencias SQL formateadas en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de JWT
jwt.secret=9a6747f3b64c61d4a607645061ce7212513a94f55393b2cef440355125a4e921
jwt.expiration=86400000

# Configuración de Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
