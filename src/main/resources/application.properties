# Configuración de la aplicación
spring.application.name=BackendForoUPC

# Conexión con MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/foro_upc_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Directiva JPA para actualizar/generar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar sentencias SQL formateadas en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
